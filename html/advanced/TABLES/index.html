<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./../../../global.css">

  <title>Tables</title>
</head>
<body>

  <h1 class="title">TABLES</h1>

  <fieldset class="idesc">
    <legend class="ilegend h3">Table</legend>

    <table class="itable">

      <thead>
        <tr> 
          <th class="iheader h3 ibord-tl">Name</th>
          <th class="iheader h3">SurName</th>
          <th class="iheader h3 ibord-tr">Opinion</th>
        </tr>
      </thead>
      
      <tbody>
        <tr>
          <td class="icol h7">Jeremy</td>
          <td class="icol h7">Salas</td>
          <td class="icol h7">Funny</td>
        </tr>

        <tr>
          <td class="icol h7">Jose</td>
          <td class="icol h7">Maria</td>
          <td class="icol h7">Boring</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="2" class="icol ibord-bl">Hello</td>
          <td class="icol ibord-br">World</td>
        </tr>
      </tfoot>
      
    </table>
  </fieldset>
</body>
</html>
