<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="textarea.css">
  <link rel="shortcut icon" href="./../../../favicon.png" type="image/x-icon">
  <title>TEXTAREA</title>
</head>
<body>

  <h1>Formulario de contacto</h1>
  
  <form class="main-form">
    <div class="input">
      <input type="text" placeholder="Jeremy Salas Quiel" class="input-field">
    </div>

    <div class="input">
      <input type="email" placeholder="jeremy@gmail.com" class="input-field">
    </div>

    <div class="input">
      <textarea
      class="input-field input-area"
      placeholder="The page is good but..."
      maxlength="999"
      rows="10" // cantidad de lineas antes del scroll
      ></textarea>
    </div>
  </form>

</body>
</html>
